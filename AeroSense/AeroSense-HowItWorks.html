<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AeroSense – How it works</title>
<style>
html,body{margin:0;background:#0b1120;font-family:-apple-system,Segoe UI,Helvetica,sans-serif}
svg{display:block;width:100vw;height:auto;max-height:100vh;margin:auto}
.ctl{position:fixed;right:12px;top:62px;opacity:0;transition:.2s;display:flex;gap:6px}.ctl:hover{opacity:1}
.ctl button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
text{font-family:-apple-system,Segoe UI,Helvetica,sans-serif}
</style></head><body>
<svg id="s" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".55"/></linearGradient>
 <linearGradient id="asph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f3f46"/><stop offset="1" stop-color="#18181b"/></linearGradient>
 <clipPath id="sceneClip"><rect x="20" y="80" width="1030" height="450" rx="18"/></clipPath>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1600" height="900" fill="#0b1120"/>
<text x="40" y="52" fill="#f8fafc" font-size="34" font-weight="800">AeroSense: how it works on a real road</text>
<text x="1560" y="52" fill="#94a3b8" font-size="18" text-anchor="end">One rider detects it → everyone is warned → council repairs it</text>

<!-- ================= ROAD SCENE ================= -->
<g clip-path="url(#sceneClip)">
 <rect x="20" y="80" width="1030" height="450" fill="url(#sky)"/>
 <!-- buildings / palms -->
 <g fill="#0f172a" opacity=".55">
  <rect x="60" y="250" width="70" height="160"/><rect x="140" y="210" width="55" height="200"/>
  <rect x="420" y="270" width="90" height="140"/><rect x="880" y="230" width="60" height="180"/><rect x="950" y="280" width="80" height="130"/>
 </g>
 <g stroke="#14532d" stroke-width="6" fill="none"><path d="M300 410 Q305 330 296 280"/><path d="M640 410 Q645 340 652 290"/></g>
 <g fill="#166534"><ellipse cx="296" cy="278" rx="38" ry="12"/><ellipse cx="652" cy="288" rx="38" ry="12"/></g>
 <!-- road -->
 <path d="M20 410 L700 410 Q712 410 716 428 L726 452 Q750 462 774 452 L784 428 Q788 410 800 410 L1050 410 L1050 530 L20 530 Z" fill="url(#asph)"/>
 <g stroke="#facc15" stroke-width="5" stroke-dasharray="40 30"><line x1="20" y1="480" x2="1050" y2="480"/></g>
 <text x="750" y="505" fill="#fca5a5" font-size="16" font-weight="700" text-anchor="middle">POTHOLE (8 cm)</text>

 <!-- detection burst at pothole -->
 <g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.47;.5;.62;.66;1" dur="12s" repeatCount="indefinite"/>
  <circle cx="750" cy="430" r="40" fill="none" stroke="#ef4444" stroke-width="4" filter="url(#glow)"/>
  <rect x="640" y="140" width="220" height="44" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="750" y="169" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">⚠ HAZARD DETECTED</text>
 </g>

 <!-- ===== SCOOTER (rear wheel center = 0,0) ===== -->
 <g>
  <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
    values="-60 380; 530 380; 600 392; 640 380; 1150 380; 1150 380"
    keyTimes="0;.44;.5;.55;.85;1"/>
  <!-- laser beam -->
  <line x1="122" y1="8" x2="122" y2="30" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 3" filter="url(#glow)">
   <animate attributeName="y2" values="30;30;52;30;30" keyTimes="0;.47;.5;.53;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <!-- wheels -->
  <circle cx="0" cy="0" r="30" fill="#111" stroke="#52525b" stroke-width="6"/><circle cx="0" cy="0" r="8" fill="#a1a1aa"/>
  <circle cx="150" cy="0" r="30" fill="#111" stroke="#52525b" stroke-width="6"/><circle cx="150" cy="0" r="8" fill="#a1a1aa"/>
  <!-- body -->
  <path d="M-30 -18 Q-20 -62 30 -62 L70 -60 Q80 -20 110 -12 L130 -14 L150 -70 L162 -70 L150 -14 Q160 -6 150 0 L40 0 Q20 -18 -30 -18 Z" fill="#16a34a" stroke="#14532d" stroke-width="3"/>
  <rect x="20" y="-74" width="58" height="12" rx="6" fill="#18181b"/>
  <line x1="150" y1="-70" x2="138" y2="-98" stroke="#d4d4d8" stroke-width="5"/><line x1="125" y1="-98" x2="150" y2="-98" stroke="#d4d4d8" stroke-width="5"/>
  <!-- rider -->
  <path d="M40 -74 L60 -128 L95 -118 L128 -96" stroke="#1e40af" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M40 -74 L95 -60 L112 -20" stroke="#334155" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="64" cy="-148" r="20" fill="#f43f5e"/><rect x="66" y="-156" width="20" height="10" rx="3" fill="#0f172a"/>
  <!-- phone in pocket -->
  <rect x="58" y="-80" width="16" height="24" rx="3" fill="#0ea5e9" stroke="#fff" stroke-width="2"/>
  <!-- AeroSense box under footboard -->
  <rect x="106" y="-8" width="32" height="18" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="122" cy="1" r="3" fill="#ef4444"/>
  <!-- BLE waves box -> phone -->
  <g opacity="0" stroke="#38bdf8" stroke-width="3" fill="none">
   <animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;.5;.53;.56;.59;.62;1" dur="12s" repeatCount="indefinite"/>
   <path d="M100 -20 Q92 -40 80 -52"/><path d="M110 -26 Q100 -52 84 -66"/>
  </g>
  <!-- 4G upload from phone -->
  <g opacity="0">
   <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.58;.6;.7;.72;1" dur="12s" repeatCount="indefinite"/>
   <line x1="66" y1="-90" x2="66" y2="-250" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur=".5s" repeatCount="indefinite"/>
   </line>
   <text x="76" y="-210" fill="#ddd6fe" font-size="15" font-weight="700">GPS + time → cloud</text>
  </g>
 </g>

 <!-- callouts (static) -->
 <g font-size="15" fill="#e2e8f0">
  <rect x="40" y="96" width="330" height="96" rx="12" fill="#0f172acc" stroke="#22d3ee"/>
  <text x="56" y="122" font-weight="800" fill="#22d3ee">📟 AeroSense box (under footboard)</text>
  <text x="56" y="146">• VL53L0X laser → distance to road</text>
  <text x="56" y="168">• MPU IMU → feels the drop / jolt</text>
  <text x="56" y="186" font-size="13" fill="#94a3b8">ESP32 decides on the bike in milliseconds</text>
 </g>
 <!-- cloud -->
 <g transform="translate(930 150)">
  <path d="M-60 20 Q-70 -10 -40 -15 Q-30 -45 5 -38 Q30 -55 50 -25 Q80 -25 75 10 Q80 30 55 30 L-45 30 Q-70 30 -60 20 Z" fill="#e0e7ff" stroke="#a78bfa" stroke-width="3">
   <animate attributeName="fill" values="#e0e7ff;#e0e7ff;#c4b5fd;#e0e7ff;#e0e7ff" keyTimes="0;.66;.7;.76;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="5" y="12" text-anchor="middle" font-size="16" font-weight="800" fill="#4c1d95">CLOUD</text>
 </g>
</g>
<rect x="20" y="80" width="1030" height="450" rx="18" fill="none" stroke="#334155" stroke-width="2"/>

<!-- ================= MUNICIPAL DASHBOARD ================= -->
<g>
 <rect x="1070" y="80" width="510" height="450" rx="18" fill="#f8fafc"/>
 <rect x="1070" y="80" width="510" height="46" rx="18" fill="#1e293b"/><rect x="1070" y="108" width="510" height="18" fill="#1e293b"/>
 <circle cx="1094" cy="103" r="6" fill="#ef4444"/><circle cx="1114" cy="103" r="6" fill="#f59e0b"/><circle cx="1134" cy="103" r="6" fill="#22c55e"/>
 <text x="1160" y="109" fill="#f1f5f9" font-size="17" font-weight="700">RDA / Council Portal: Live Hazard Map</text>
 <!-- map -->
 <rect x="1088" y="140" width="474" height="230" rx="10" fill="#e2e8f0"/>
 <path d="M1088 330 Q1260 300 1562 200" stroke="#475569" stroke-width="10" fill="none"/>
 <path d="M1260 140 L1300 370" stroke="#94a3b8" stroke-width="7"/><path d="M1088 220 L1562 270" stroke="#94a3b8" stroke-width="6"/>
 <path d="M1440 140 L1420 370" stroke="#94a3b8" stroke-width="6"/>
 <rect x="1500" y="150" width="62" height="70" fill="#bfdbfe"/><text x="1531" y="190" font-size="11" fill="#1e40af" text-anchor="middle">Sea</text>
 <text x="1100" y="352" font-size="12" fill="#334155" font-weight="700">Galle Rd</text>
 <text x="1305" y="160" font-size="12" fill="#475569">Duplication Rd</text>
 <!-- heat + old pins -->
 <circle cx="1180" cy="230" r="26" fill="#f59e0b" opacity=".25"/><text x="1180" y="236" font-size="20" text-anchor="middle">📍</text>
 <circle cx="1440" cy="300" r="20" fill="#facc15" opacity=".3"/><text x="1440" y="306" font-size="18" text-anchor="middle">📍</text>
 <!-- NEW pin -->
 <g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.74;.97;1" dur="12s" repeatCount="indefinite"/>
  <circle cx="1350" cy="268" r="14" fill="#ef4444" opacity=".35">
   <animate attributeName="r" values="14;38;14" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1350" y="276" font-size="26" text-anchor="middle">📍</text>
  <rect x="1366" y="226" width="118" height="26" rx="6" fill="#7f1d1d"/><text x="1425" y="244" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">NEW • 8 cm deep</text>
 </g>
 <!-- table -->
 <g font-size="13" fill="#0f172a">
  <text x="1090" y="396" font-weight="800" fill="#475569">LOCATION</text><text x="1260" y="396" font-weight="800" fill="#475569">DEPTH</text><text x="1340" y="396" font-weight="800" fill="#475569">REPORTS</text><text x="1440" y="396" font-weight="800" fill="#475569">PRIORITY</text>
  <line x1="1088" y1="404" x2="1562" y2="404" stroke="#cbd5e1"/>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.76;.97;1" dur="12s" repeatCount="indefinite"/>
   <rect x="1086" y="408" width="478" height="28" fill="#fee2e2"/>
   <text x="1090" y="427">Galle Rd, Col 03</text><text x="1260" y="427">8 cm</text><text x="1340" y="427">14 riders</text>
   <rect x="1440" y="413" width="80" height="20" rx="10" fill="#dc2626"/><text x="1480" y="427" fill="#fff" text-anchor="middle" font-weight="700">HIGH</text>
  </g>
  <text x="1090" y="458">Baseline Rd</text><text x="1260" y="458">5 cm</text><text x="1340" y="458">6 riders</text>
  <rect x="1440" y="444" width="80" height="20" rx="10" fill="#f59e0b"/><text x="1480" y="458" fill="#fff" text-anchor="middle" font-weight="700">MED</text>
  <text x="1090" y="488">Havelock Rd</text><text x="1260" y="488">2 cm</text><text x="1340" y="488">2 riders</text>
  <rect x="1440" y="474" width="80" height="20" rx="10" fill="#84cc16"/><text x="1480" y="488" fill="#fff" text-anchor="middle" font-weight="700">LOW</text>
  <rect x="1088" y="500" width="474" height="22" rx="6" fill="#dbeafe"/><text x="1325" y="516" text-anchor="middle" fill="#1e40af" font-weight="700">🛠 Dispatch repair crew → worst first</text>
 </g>
</g>

<!-- ================= PIPELINE ================= -->
<g font-size="16">
 <text x="40" y="572" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="2">THE 5-STEP FLOW</text>
 <!-- card template x: 40, 348, 656, 964, 1272 ; w 288 -->
 <g id="cards">
 </g>
</g>
<g id="pipe"></g>
</svg>
<div class="ctl"><button onclick="s.pauseAnimations()">⏸ Pause</button><button onclick="s.unpauseAnimations()">▶ Play</button><button onclick="s.setCurrentTime(0)">↺ Restart</button></div>
<script>
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg',pipe=document.getElementById('pipe');
const steps=[
 ['📟','1. SENSE','Laser sees the road get','farther + IMU feels a drop','#22d3ee',.48,'Built ✅'],
 ['📶','2. SEND','Tiny Bluetooth message','to the phone in your pocket','#38bdf8',.53,'Next phase'],
 ['📱','3. LOCATE','Phone adds GPS + time,','uploads over 4G','#a78bfa',.6,'Next phase'],
 ['☁️','4. COMBINE','Many riders = 1 pothole,','confidence + severity score','#f472b6',.68,'Next phase'],
 ['🛠️','5. ACT','Council repairs worst first;','next riders get a soft alert','#22c55e',.75,'Next phase']];
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||pipe).appendChild(e);return e};
steps.forEach((st,i)=>{
 const x=40+i*308,y=590,w=288,h=270;
 const g=el('g',{});
 const r=el('rect',{x,y,width:w,height:h,rx:16,fill:'#111827',stroke:'#334155','stroke-width':2},g);
 el('animate',{attributeName:'stroke',values:`#334155;#334155;${st[4]};${st[4]};#334155`,keyTimes:`0;${st[5]};${st[5]+.01};.97;1`,dur:'12s',repeatCount:'indefinite'},r);
 el('animate',{attributeName:'stroke-width',values:'2;2;5;5;2',keyTimes:`0;${st[5]};${st[5]+.01};.97;1`,dur:'12s',repeatCount:'indefinite'},r);
 const ic=el('text',{x:x+w/2,y:y+82,'font-size':58,'text-anchor':'middle'},g);ic.textContent=st[0];
 const t=el('text',{x:x+w/2,y:y+136,'font-size':24,'font-weight':800,fill:st[4],'text-anchor':'middle'},g);t.textContent=st[1];
 [st[2],st[3]].forEach((l,j)=>{const q=el('text',{x:x+w/2,y:y+172+j*26,'font-size':17,fill:'#e2e8f0','text-anchor':'middle'},g);q.textContent=l});
 const done=st[6].includes('✅');
 el('rect',{x:x+w/2-62,y:y+222,width:124,height:30,rx:15,fill:done?'#14532d':'#1e293b',stroke:done?'#22c55e':'#475569'},g);
 const b=el('text',{x:x+w/2,y:y+243,'font-size':15,'font-weight':700,fill:done?'#86efac':'#94a3b8','text-anchor':'middle'},g);b.textContent=st[6];
 if(i<4){const a=el('text',{x:x+w+10,y:y+h/2+10,'font-size':28,fill:'#64748b','text-anchor':'middle'});a.textContent='➜';}
});
</script>
</body></html>
